[project]
name = "vlah-testbed"
version = "0.1.0"
description = "Herd testbed: cheap problems, a scarce slow judge, recorder, scorecard and the shared integrator (issue #10)."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "simpy>=4.1",
    "uvicorn>=0.29",
]

[project.scripts]
tb = "testbed.cli.main:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

# This directory is the importable package "testbed" itself. The workspace installs it editable:
# only a path entry for the repo root, nothing copied (a copy would shadow the repo and leak
# DECISIONS.md into the agents' sandbox).
[tool.hatch.build]
dev-mode-dirs = [".."]

[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.ruff]
extend = "../pyproject.toml"
