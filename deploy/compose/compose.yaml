name: vlah
services:
  redis:
    image: redis:7-alpine
    command:
    - redis-server
    - --appendonly
    - 'yes'
    ports:
    - 127.0.0.1:6379:6379
    volumes:
    - vlah-redis:/data
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  vlah-redis: {}
